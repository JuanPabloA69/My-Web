<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Restaurante Sabor Urbano</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
}

/* HERO */
.hero {
    background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
    url('https://images.unsplash.com/photo-1504674900247-0877df9cc836') center/cover;
    color: white;
    text-align: center;
    padding: 100px 20px;
}

.hero h1 {
    font-size: 45px;
}

.hero p {
    font-size: 20px;
}

/* BOTÓN */
.btn {
    margin-top: 20px;
    background-color: #ff4d4d;
    color: white;
    padding: 15px 25px;
    border: none;
    border-radius: 10px;
    font-size: 18px;
    cursor: pointer;
}

.btn:hover {
    background-color: #e63c3c;
}

/* SECCIONES */
.section {
    padding: 50px 20px;
    text-align: center;
}

.cards {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
}

.card {
    background: #f5f5f5;
    padding: 20px;
    width: 250px;
    border-radius: 15px;
}

/* GALERÍA */
.gallery img {
    width: 250px;
    border-radius: 10px;
    margin: 10px;
}

/* FOOTER */
.footer {
    background: #111;
    color: white;
    padding: 20px;
}

/* WHATSAPP */
.whatsapp-float {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #25D366;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
}

.whatsapp-float img {
    width: 35px;
}

/* RESPONSIVE */
@media (max-width: 768px) {
    .cards {
        flex-direction: column;
        align-items: center;
    }

    .hero h1 {
        font-size: 28px;
    }

    .hero p {
        font-size: 16px;
    }
}
</style>
</head>

<body>

<!-- HERO -->
<div class="hero">
    <h1>🍔 Sabor Urbano</h1>
    <p>Comida deliciosa directo a tu mesa</p>

    <a href="https://wa.me/573158960658?text=Hola%20quiero%20hacer%20un%20pedido" target="_blank">
        <button class="btn">Hacer pedido 📲</button>
    </a>
</div>

<!-- MENÚ -->
<div class="section">
    <h2>Menú</h2>

    <div class="cards">
        <div class="card">
            <h3>Hamburguesa</h3>
            <p>$18.000</p>
        </div>

        <div class="card">
            <h3>Pizza</h3>
            <p>$22.000</p>
        </div>

        <div class="card">
            <h3>Perro caliente</h3>
            <p>$12.000</p>
        </div>
    </div>
</div>

<!-- GALERÍA -->
<div class="section gallery">
    <h2>Platos</h2>
    <img src="https://images.unsplash.com/photo-1550547660-d9450f859349">
    <img src="https://images.unsplash.com/photo-1548365328-9f547fb0953c">
    <img src="https://images.unsplash.com/photo-1565299624946-b28f40a0ae38">
</div>

<!-- FOOTER -->
<div class="footer">
    <p>Haz tu pedido por WhatsApp 📲</p>
</div>

<!-- BOTÓN WHATSAPP -->
<a href="https://wa.me/573158960658?text=Hola%20quiero%20informacion" class="whatsapp-float" target="_blank">
    <img src="https://cdn-icons-png.flaticon.com/512/733/733585.png">
</a>

</body>
</html>
